services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: praman-postgres
    environment:
      POSTGRES_DB: praman
      POSTGRES_USER: praman
      POSTGRES_PASSWORD: praman
    ports:
      - "5432:5432"
    volumes:
      - praman-postgres:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praman -d praman"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: praman-backend
    environment:
      DATABASE_URL: postgresql+psycopg://praman:praman@postgres:5432/praman
      JWT_SECRET: praman-local-demo-secret
      DEMO_ENGINE: LOCAL DEMO ENGINE
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: praman-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  praman-postgres:
